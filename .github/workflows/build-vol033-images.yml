name: Build VOL033 Images
on:
  push:
    paths:
      - '.github/workflows/build-vol033-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/build_vol033_images_20261030.py
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/APF_TODAY_INSIGHT_VOL033_20261030_IMAGE_BUILD.html dist/vol033-image-provenance.json
          git commit -m "Build VOL033 with embedded source images"
          git push
