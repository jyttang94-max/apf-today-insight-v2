name: Pack VOL033 images
on:
  push:
    paths: ['.github/workflows/pack-vol033.yml']
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install beautifulsoup4 pillow
      - run: python scripts/pack_vol033_images.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/vol033_packed_images.json
          git commit -m "Pack VOL033 image bytes"
          git push
