name: Cross-account public source fresh source acquisition
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/cross-account-image-acquire.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - name: Fetch fresh original pages and image files
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p sources
          cat > /tmp/fetch.py <<'PY'
          import requests,json,pathlib,concurrent.futures,urllib.parse,io,datetime
          from bs4 import BeautifulSoup
          from PIL import Image
          root=pathlib.Path("sources")
          urls={
            "academic":"https://www.dailian.co.kr/news/view/1709405/27%EB%85%84-%EB%A7%8C%EC%97%90-%ED%95%9C%EA%B5%AD-%EC%98%A8-%EC%95%84%ED%83%9C-%EC%9D%98%EA%B3%B5%ED%95%99%EA%B3%84-2026",
            "culture":"https://web.dongguk.ac.kr/article/wisenews/detail/521037",
            "youth":"https://m.pressian.com/pages/articles/2026110116562516311",
            "editor":"https://www.artkoreatv.com/news/articleView.html?idxno=105355",
            "book":"https://www.yes24.com/Product/Goods/35254168"
          }
          def work(pair):
           key,url=pair; out={"key":key,"url":url,"images":[]}
           try:
            s=requests.Session();s.headers["User-Agent"]="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
            r=s.get(url,timeout=25);r.raise_for_status()
            if not r.encoding or r.encoding=="ISO-8859-1":r.encoding=r.apparent_encoding
            soup=BeautifulSoup(r.text,"html.parser");out["final_url"]=r.url
            out["retrieved_at_utc"]=datetime.datetime.now(datetime.timezone.utc).isoformat()
            out["title"]=soup.title.get_text(" ",strip=True) if soup.title else ""
            for el in soup(["script","style","nav","footer","header","noscript"]):el.decompose()
            out["text"]=soup.get_text(" ",strip=True)
            imgs=[]
            for m in soup.select('meta[property="og:image"], meta[name="twitter:image"], meta[property="twitter:image"]'):
             if m.get("content"):imgs.append((m["content"],"page metadata"))
            for im in soup.select("article img, #article-view-content-div img, #news_body_area img, .article img, .news_body img, .view_con img, .content img, main img, img"):
             src=im.get("data-src") or im.get("data-original") or im.get("src")
             if src:imgs.append((src,im.get("alt","")))
            seen=set()
            for src,alt in imgs:
             src=urllib.parse.urljoin(r.url,src)
             if src in seen or not src.startswith("http"):continue
             seen.add(src)
             if len(out["images"])>=8:break
             try:
              ir=s.get(src,headers={"Referer":r.url},timeout=15);ir.raise_for_status()
              im=Image.open(io.BytesIO(ir.content));w,h=im.size
              if w<200 or h<120:continue
              fn=key+"-"+str(len(out["images"]))+".jpg"
              im.convert("RGB").save(root/fn,quality=92)
              out["images"].append({"path":fn,"source_url":src,"alt":alt,"width":w,"height":h,"bytes":(root/fn).stat().st_size})
             except Exception as e:out.setdefault("image_errors",[]).append({"url":src,"error":str(e)[:200]})
           except Exception as e:out["error"]=str(e)
           (root/(key+".json")).write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
           print(key,"text_chars=",len(out.get("text","")),"images=",len(out["images"]),"error=",out.get("error",""))
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:list(ex.map(work,urls.items()))
          (root/"manifest.json").write_text(json.dumps({"collected_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"candidates":urls},ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          python /tmp/fetch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apf-fresh-sources-20261102
          path: sources/
          retention-days: 1
