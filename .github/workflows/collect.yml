
name: APF V2 News Collection

on:
  workflow_dispatch:
  schedule:
    # 월~금 08:00 KST
    - cron: '0 23 * * 0-4'

    # 월~금 16:00 KST
    - cron: '0 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: apf-v2-news-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect articles
        run: python scripts/collect.py

      - name: Save candidate board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest.json
          git add data/latest.html
          git add data/seen.json
          git add data/history/

          if ! git diff --cached --quiet; then
            git commit -m "Update APF candidate board"
            git push
          fi

      - name: Backup collection results
        uses: actions/upload-artifact@v4
        with:
          name: apf-v2-candidates
          path: |
            data/latest.json
            data/latest.html
          retention-days: 14
