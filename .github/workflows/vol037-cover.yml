name: VOL037 book cover acquisition
on:
  push:
    branches: [review/vol037-book-20261103]
    paths: [.github/workflows/vol037-cover.yml]
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          curl -fL --max-time 30 https://image.yes24.com/goods/117860065/XL -o out/book.jpg
          file out/book.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: vol037-book-cover
          path: out
          retention-days: 1
