name: APF V2 Stage 2 Validation
on:
  push:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-stage2-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s v2 -p 'test_*.py' -v
      - name: Real candidate smoke test
        run: |
          python v2/stage2.py --candidates data/v5/runs/20261029T224853-40885391548-1/candidates.json --registry v2/publication_registry.json --evidence v2/verified_articles.json --out /tmp/stage2_report.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/stage2_report.json'))
          assert data['eligible']==0, 'unverified articles must not be eligible'
          assert data['held']==data['total']
          print('Fail-closed smoke test passed:',data['total'],'held')
          PY

      - name: Issue inventory smoke test
        run: |
          python v2/inventory_issues.py dist/APF_TODAY_INSIGHT_VOL033_20261030_FINAL.html --out /tmp/apf_issue_inventory.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/apf_issue_inventory.json'))
          assert len(d['issues'])==1
          assert d['issues'][0]['publication_status']=='unconfirmed'
          print('Issue inventory:',d['issues'][0]['vol'],'links:',len(d['issues'][0]['links']))
          PY
      - name: Original URL availability diagnostic
        run: |
          python v2/probe_originals.py --candidates data/v5/runs/20261029T224853-40885391548-1/candidates.json --out /tmp/apf_original_probe.json --limit 20
          python - <<'PY'
          import json
          d=json.load(open('/tmp/apf_original_probe.json'))
          assert d['probed']==20
          assert all(x['body_verified'] is False for x in d['results'])
          print('Original probe statuses:',{s:sum(x['verification_status']==s for x in d['results']) for s in set(x['verification_status'] for x in d['results'])})
          PY

      - name: Google News publisher URL resolution diagnostic
        run: |
          python v2/resolve_original_urls.py --candidates data/v5/runs/20261029T224853-40885391548-1/candidates.json --out /tmp/apf_resolved_urls.json --limit 20
          python - <<'PY'
          import json
          d=json.load(open('/tmp/apf_resolved_urls.json'))
          assert d['resolved']+d['unresolved']==20
          print('Publisher URLs resolved:',d['resolved'],'unresolved:',d['unresolved'])
          PY

      - name: Editorial handoff retains unresolved articles
        run: |
          python v2/export_editorial_queue.py --candidates data/v5/runs/20261029T224853-40885391548-1/candidates.json --resolution /tmp/apf_resolved_urls.json --limit 20 --out /tmp/apf_editorial_queue.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/apf_editorial_queue.json'))
          assert q['total']==20
          assert all(x['editorial_status']=='needs_independent_search' for x in q['candidates'])
          assert all(x['search_queries'] for x in q['candidates'])
          print('Editorial handoff passed: 20 candidates preserved for independent search')
          PY

      - name: Build provisional history index
        run: |
          python v2/build_history_index.py dist/APF_TODAY_INSIGHT_VOL033_20261030_FINAL.html --out /tmp/apf_history_index.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/apf_history_index.json'))
          assert data['issues_found']==1
          assert data['coverage_complete'] is False
          assert all(r['status']=='unconfirmed_issue_link' for r in data['records'])
          print('History index prepared:',len(data['records']),'link hints; no sent claims')
          PY
      - name: Editorial review with evidence and provisional history
        run: |
          python v2/editorial_review_report.py --candidates data/v5/runs/20261029T224853-40885391548-1/candidates.json --evidence v2/verified_articles.json --history /tmp/apf_history_index.json --out /tmp/apf_editorial_review.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/apf_editorial_review.json'))
          assert d['publication_approved'] is False
          assert d['total']>0
          print('Editorial review report:',d['total'],'candidates,',d['review_candidates'],'evidence-backed review candidates')
          PY
      - name: VOL032 production readiness from real editorial copy
        run: |
          python v2/vol032_production_gate.py --editorial v2/editorial/2026-10-30-1400.json --out /tmp/apf_vol032_production_gate.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/apf_vol032_production_gate.json'))
          assert d['verified_stories']==2
          assert d['ready_for_full_html'] is False
          assert 'MISSING_SLOT:arts' in d['errors']
          print('Partial editorial copy correctly held; old VOL032 content must not leak')
          PY
      - name: Preserve editorial handoff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apf-v2-editorial-handoff
          path: |
            /tmp/apf_editorial_queue.json
            /tmp/apf_resolved_urls.json
            /tmp/apf_original_probe.json
            /tmp/apf_history_index.json
            /tmp/apf_editorial_review.json
            /tmp/apf_vol032_production_gate.json
          if-no-files-found: warn
          retention-days: 14
