name: Package VOL033 Final
on:
  push:
    paths: ['.github/workflows/package-vol033-final.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install beautifulsoup4 pillow
      - run: python scripts/package_vol033_final.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/APF_TODAY_INSIGHT_VOL033_20261030_FINAL.zip
          git commit -m "Package VOL033 HTML for download"
          git push
