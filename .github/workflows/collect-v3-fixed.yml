
name: APF V3 Fixed Collection

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect articles
        run: python scripts/collect_v3.py

      - name: Save collection results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v3/
          if ! git diff --cached --quiet; then
            git commit -m "Save APF V3 candidates"
            git push
          fi

      - name: Upload backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apf-v3-results
          path: data/v3/
          retention-days: 14
