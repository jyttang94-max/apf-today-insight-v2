name: Inspect requested VOL033 sources
on:
  push:
    paths: ['.github/workflows/inspect-vol033-requested.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests beautifulsoup4
      - run: python scripts/inspect_vol033_requested.py
