name: APF V4 Storage Pilot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apf-v4-storage-pilot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect isolated snapshots
        run: python scripts/collect_v4_storage_pilot.py

      - name: Keep backup even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apf-v4-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/v4/runs/
          if-no-files-found: warn
          retention-days: 14

      - name: Save only new snapshot files
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/v4/runs/

          if git diff --cached --quiet; then
            exit 0
          fi

          if git diff --cached --name-status | awk '$1 != "A" { bad=1 } END { exit !bad }'; then
            echo "Refusing to modify or delete an existing file"
            exit 1
          fi

          git commit -m "Add APF V4 snapshot ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          for attempt in 1 2 3; do
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH"

            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
          done

          echo "Push failed; collection backup is retained as an artifact"
          exit 1
