name: VOL030 Source Image Collector (Manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'Pillow>=10,<13'
      - name: Download candidate source images
        run: python scripts/collect_vol030_images.py --output output/vol030_images
      - name: Upload review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vol030-source-image-review
          path: output/vol030_images/
          if-no-files-found: warn
          retention-days: 14
